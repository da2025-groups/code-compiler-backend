services:
  piston:
    build:
      context: .
      dockerfile: Dockerfile.piston
    image: piston-nosec
    container_name: piston
    privileged: true
    platform: linux/amd64
    security_opt:
      - seccomp=unconfined
    ports:
      - "2000:2000"
    environment:
      # Raise Piston's per-request timeout ceiling so JVM languages have room
      - PISTON_RUN_TIMEOUT=12000
      - PISTON_COMPILE_TIMEOUT=12000
    volumes:
      - piston_data:/piston
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2000/api/v2/runtimes"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  fastapi:
    build: .
    container_name: fastapi
    ports:
      - "8000:8000"
    depends_on:
      - piston
    environment:
      - PISTON_URL=http://piston:2000
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/.venv
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  piston_data:
